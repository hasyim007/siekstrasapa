<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEKSTRASAPA - Sistem Informasi Ekstrakurikuler SDN 01 Papahan | Login Admin</title>

    <!-- Google Fonts: Plus Jakarta Sans (sama dengan halaman lain) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    fontSize: { 'xxs': '0.65rem' },
                    colors: {
                        indigo: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/40 to-blue-50/60 min-h-screen text-slate-800 flex items-center justify-center px-4 selection:bg-indigo-100 selection:text-indigo-900">

    <div class="w-full max-w-sm">
        <!-- Brand header -->
        <div class="flex flex-col items-center mb-6">
            <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-2xl text-white shadow-lg shadow-indigo-200/50 flex items-center justify-center overflow-hidden brand-logo-slot mb-3" data-size="lg">
                <i data-lucide="school" class="w-7 h-7"></i>
            </div>
            <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-[10px] font-extrabold uppercase tracking-widest rounded-full mb-2">SIEKSTRASAPA</span>
            <h1 class="text-sm font-extrabold tracking-wide text-slate-900 uppercase brand-school-name">SDN 01 PAPAHAN</h1>
            <p class="text-xs text-indigo-600 font-medium tracking-tight text-center mt-1">Sistem Informasi Ekstrakurikuler<br>SDN 01 Papahan</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full relative glass-card">
            <div class="text-center mb-6 pt-1">
                <div class="w-12 h-12 md:w-14 md:h-14 bg-indigo-50 rounded-2xl text-indigo-600 flex items-center justify-center mx-auto mb-3 shadow-inner">
                    <i data-lucide="shield-check" class="w-6 h-6 md:w-7 md:h-7"></i>
                </div>
                <h3 class="text-lg md:text-xl font-extrabold text-slate-900">Akses Administrator</h3>
                <p class="text-xs text-slate-500 mt-1">Masuk untuk mengelola data sekolah.</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <input type="text" id="login-username" required autocomplete="username"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:border-indigo-500"
                        placeholder="Username">
                </div>
                <div>
                    <input type="password" id="login-password" required autocomplete="current-password"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:border-indigo-500"
                        placeholder="Password">
                </div>
                <div id="login-error-msg" class="d-none bg-rose-50 border border-rose-100 text-rose-600 text-xs px-3 py-2 rounded-lg font-medium text-center">
                    Kredensial tidak valid.
                </div>
                <div class="pt-2">
                    <button type="submit" id="login-submit-btn"
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-200/60 transition-colors flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
                        <span id="login-submit-text">Masuk Sistem</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-indigo-600 transition-colors">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        // Halaman ini SENGAJA dibuat berdiri sendiri (tidak memuat assets/app.js
        // secara penuh) supaya tidak ikut memicu logika ADMIN_PAGES/redirect milik
        // app.js. Halaman ini hanya butuh 3 hal: (1) tampilkan nama/logo sekolah,
        // (2) kirim login ke /api/login, (3) simpan sesi dgn KUNCI YANG SAMA
        // persis dipakai assets/app.js supaya halaman admin lain (dashboard,
        // kelola, dst) mengenali sesi ini sebagai valid.
        const LOGIN_URL = '/api/login';
        const DATA_URL = '/api/data';
        const ADMIN_SESSION_KEY = 'sdn01_admin_session';
        const ADMIN_PASS_SESSION_KEY = 'sdn01_admin_pass_session';
        const DEFAULT_USERNAME = 'admin';
        // Username admin YANG SEBENARNYA dipakai untuk validasi -- diisi dari
        // /api/data (field settings.adminUsername) oleh loadBranding() di bawah,
        // supaya konsisten dengan authManager.login() di assets/app.js. SEBELUMNYA
        // halaman ini selalu membandingkan ke literal 'admin' (DEFAULT_USERNAME)
        // apa pun isinya -- jadi kalau admin sudah mengganti username lewat
        // Pengaturan, login lewat halaman berdiri sendiri ini akan SELALU gagal
        // ("Kredensial tidak valid") walau password yang dimasukkan sudah benar.
        let validUsername = DEFAULT_USERNAME;

        // Kalau sudah login sebelumnya (sesi masih ada), langsung lempar ke
        // Dashboard -- tidak perlu isi form login lagi.
        if (sessionStorage.getItem(ADMIN_SESSION_KEY) === '1') {
            window.location.href = getRedirectTarget();
        }

        function getRedirectTarget() {
            const params = new URLSearchParams(window.location.search);
            const target = params.get('redirect');
            // Whitelist sederhana supaya parameter URL tidak bisa dipakai untuk
            // redirect ke luar situs (open redirect) -- hanya izinkan nama file
            // .html tanpa "://" atau "/" di dalamnya.
            if (target && /^[a-zA-Z0-9_-]+\.html$/.test(target)) return target;
            return 'dashboard.html';
        }

        // Ambil nama & logo sekolah dari server supaya halaman login tetap
        // terasa konsisten dengan branding yang diatur admin di halaman
        // Pengaturan (endpoint ini publik, aman diakses tanpa login).
        async function loadBranding() {
            try {
                const res = await fetch(DATA_URL);
                const json = await res.json();
                if (json && json.success) {
                    const s = Array.isArray(json.data.settings) ? json.data.settings[0] : null;
                    if (s && s.schoolName) {
                        document.querySelectorAll('.brand-school-name').forEach(el => { el.textContent = s.schoolName; });
                    }
                    if (s && s.logoUrl) {
                        document.querySelectorAll('.brand-logo-slot').forEach(el => {
                            el.innerHTML = `<img src="${s.logoUrl}" alt="Logo Sekolah" class="w-full h-full object-cover">`;
                        });
                    }
                    if (s && s.adminUsername) {
                        validUsername = s.adminUsername;
                    }
                }
            } catch (err) {
                // Gagal ambil branding/username bukan hal fatal -- tetap pakai
                // DEFAULT_USERNAME ('admin') sebagai fallback di validUsername.
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('login-error-msg');
            const btn = document.getElementById('login-submit-btn');
            const btnText = document.getElementById('login-submit-text');
            errorEl.classList.add('d-none');

            const enteredUser = document.getElementById('login-username').value.trim();
            const enteredPass = document.getElementById('login-password').value;

            // Pastikan validUsername sudah benar-benar terisi dari server (bukan
            // masih fallback default) sebelum dibandingkan -- brandingPromise sudah
            // mulai jalan sejak halaman dimuat, jadi await di sini biasanya langsung
            // selesai seketika (kecuali baru saja submit sangat cepat setelah load).
            await brandingPromise;

            // Username cuma pemeriksaan kosmetik (sama seperti modal login lama) --
            // yang benar-benar menentukan sah/tidaknya adalah verifikasi password
            // ke server lewat /api/login. Dibandingkan ke validUsername (hasil
            // fetch dari settings.adminUsername), BUKAN literal 'admin', supaya
            // tetap bisa login kalau admin sudah mengganti username lewat Pengaturan.
            if (enteredUser !== validUsername) {
                errorEl.textContent = 'Kredensial tidak valid.';
                errorEl.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Memeriksa...';

            try {
                const res = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: enteredPass })
                });
                const json = await res.json().catch(() => null);

                if (json && json.success) {
                    sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
                    sessionStorage.setItem(ADMIN_PASS_SESSION_KEY, enteredPass);
                    btnText.textContent = 'Berhasil, mengalihkan...';
                    window.location.href = getRedirectTarget();
                } else {
                    errorEl.textContent = (json && json.error) ? json.error : 'Kredensial tidak valid.';
                    errorEl.classList.remove('d-none');
                    btn.disabled = false;
                    btnText.textContent = 'Masuk Sistem';
                }
            } catch (err) {
                errorEl.textContent = 'Gagal menghubungi server. Cek koneksi internet Anda.';
                errorEl.classList.remove('d-none');
                btn.disabled = false;
                btnText.textContent = 'Masuk Sistem';
            }
        });

        const brandingPromise = loadBranding();
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
